<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>სხვა — რესტორანი</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0d0b; --bg2:#1a1613; --gold:#d4a54a; --bronze:#a8743a;
  --green:#1f6b45; --green-d:#14472e; --green-l:#2fa86a; --white:#fff;
  --text:#fff; --muted:#bdb4a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans Georgian',system-ui,sans-serif;color:var(--text);
  background:var(--bg);min-height:100vh;overflow-x:hidden;line-height:1.5;
}
/* background arcs */
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 0%,#1f1a15 0%,var(--bg) 60%)}
.bg svg{width:100%;height:100%}
.bg circle{fill:none;stroke:url(#g);stroke-width:1.2;opacity:.35}

/* header */
header{
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px clamp(16px,4vw,48px);position:sticky;top:0;z-index:20;
  background:rgba(15,13,11,.8);backdrop-filter:blur(10px);border-bottom:1px solid rgba(212,165,74,.15);
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--bg2)}
.brand span{color:var(--gold);font-size:1.7rem;font-weight:800}
nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;
  background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.25);
  font:inherit;font-size:.95rem;cursor:pointer;text-decoration:none;transition:.2s;
}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.delivery{border:2px solid var(--green-l);background:var(--green);color:#fff}
.btn.delivery:hover{background:var(--green-l);color:#fff}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:12px;overflow:hidden}
.lang button{background:none;border:0;color:var(--white);padding:9px 12px;font:inherit;font-size:.9rem;cursor:pointer;display:flex;gap:6px;align-items:center}
.lang button.on{background:var(--gold);color:#1a1208;font-weight:700}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* main */
main{max-width:1000px;margin:0 auto;padding:clamp(32px,6vw,72px) 20px 40px}
h1{text-align:center;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;margin-bottom:36px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{
  position:relative;aspect-ratio:4/3.2;border-radius:24px;overflow:hidden;border:1px solid rgba(212,165,74,.3);
  background-size:cover;background-position:center;cursor:pointer;text-decoration:none;color:#fff;
  transition:transform .3s,box-shadow .3s,border-color .3s;
}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.05) 60%)}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(212,165,74,.2);border-color:var(--gold)}
.card b{position:absolute;left:22px;bottom:18px;z-index:1;font-size:1.6rem;font-weight:800}

.banner{
  margin-top:28px;display:flex;align-items:center;gap:20px;padding:20px 24px;border-radius:22px;
  background:#fff;box-shadow:0 10px 36px rgba(47,168,106,.35);text-decoration:none;transition:.25s;
}
.banner:hover{transform:translateY(-3px);box-shadow:0 14px 44px rgba(47,168,106,.5)}
.ibox{width:64px;height:64px;border-radius:16px;background:var(--green-d);display:grid;place-items:center;flex:none}
.ibox svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner .t{flex:1}
.banner .t strong{display:block;font-size:2rem;font-weight:800;color:var(--green-d);line-height:1.1}
.banner .t span{color:var(--green-d);font-size:1.05rem}
.banner .arrow{width:34px;height:34px;stroke:var(--green-d);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* menu */
.menu{max-width:1100px;margin:0 auto;padding:40px 20px 120px}
.menu h2{font-size:clamp(1.5rem,3vw,2rem);margin:48px 0 24px;display:flex;align-items:center;gap:14px}
.menu h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bronze),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.item{background:var(--bg2);border:1px solid rgba(212,165,74,.15);border-radius:18px;overflow:hidden;transition:.25s}
.item:hover{transform:translateY(-4px);border-color:var(--gold)}
.item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#2a241e}
.item div{padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item h3{font-size:1.05rem;font-weight:700}
.item .p{color:var(--gold);font-weight:800;white-space:nowrap}

/* chatbot */
.chat{
  position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,#e6bd68,var(--bronze));display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(212,165,74,.4);transition:.2s;z-index:30;
}
.chat:hover{transform:scale(1.08)}
.chat svg{width:28px;height:28px;stroke:#1a1208;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:640px){
  .cards{gap:12px}.card b{font-size:1.15rem;left:14px;bottom:12px}
  .banner .t strong{font-size:1.5rem}
  header{justify-content:center}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4a54a"/><stop offset="1" stop-color="#a8743a"/></linearGradient></defs>
    <circle cx="1150" cy="120" r="380"/><circle cx="1150" cy="120" r="470"/><circle cx="1150" cy="120" r="560"/>
    <circle cx="40" cy="760" r="320"/><circle cx="40" cy="760" r="410"/><circle cx="40" cy="760" r="500"/>
  </svg>
</div>

<header>
  <a class="brand" href="#top">
    <img src="https://play-lh.googleusercontent.com/YjFPD8Az2nDvnCW6EFvzE_OleEnRHAXofGq2uBsubnVfOnYitYZ_b4_mz3TrzsPst6dxUuHLQKhS2tPMBosJYIE=w240-h480-rw" alt="სხვა">
    <span>სხვა</span>
  </a>
  <nav>
    <a class="btn" href="#profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg><span data-i="profile">პროფილი</span></a>
    <a class="btn" href="#menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i="menu">მენიუ</span></a>
    <a class="btn delivery" href="#delivery"><svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-3-8h4M5 9h4"/></svg><span data-i="delivery">მიტანის სერვისი</span></a>
    <div class="lang" role="group" aria-label="Language">
      <button class="on" data-lang="ka">🇬🇪 ქართ</button>
      <button data-lang="en">🇬🇧 ENG</button>
    </div>
  </nav>
</header>

<main id="top">
  <h1 data-i="choose">აირჩიე კატეგორია</h1>
  <div class="cards">
    <a class="card" href="#food" style="background-image:url('https://images.unsplash.com/photo-1544025162-d76694265947?w=800&q=70')"><b data-i="food">საჭმელი</b></a>
    <a class="card" href="#drinks" style="background-image:url('https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=800&q=70')"><b data-i="drinks">სასმელი</b></a>
  </div>

  <a class="banner" id="delivery" href="#delivery">
    <div class="ibox"><svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-3-8h4M5 9h4"/></svg></div>
    <div class="t"><strong>Delivery</strong><span data-i="delivery">მიტანის სერვისი</span></div>
    <svg class="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</main>

<section class="menu" id="menu">
  <h2 id="food" data-i="food">საჭმელი</h2>
  <div class="grid">
    <div class="item"><img loading="lazy" alt="ხინკალი" src="https://images.unsplash.com/photo-1626200419199-391ae4be7a41?w=500&q=70"><div><h3 data-n="ხინკალი|Khinkali">ხინკალი</h3><span class="p">1.50 ₾</span></div></div>
    <div class="item"><img loading="lazy" alt="ხაჭაპური" src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=70"><div><h3 data-n="ხაჭაპური|Khachapuri">ხაჭაპური</h3><span class="p">16 ₾</span></div></div>
    <div class="item"><img loading="lazy" alt="მწვადი" src="https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=500&q=70"><div><h3 data-n="მწვადი|Mtsvadi">მწვადი</h3><span class="p">22 ₾</span></div></div>
    <div class="item"><img loading="lazy" alt="ლობიანი" src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=500&q=70"><div><h3 data-n="ლობიანი|Lobiani">ლობიანი</h3><span class="p">9 ₾</span></div></div>
  </div>

  <h2 id="drinks" data-i="drinks">სასმელი</h2>
  <div class="grid">
    <div class="item"><img loading="lazy" alt="ღვინო" src="https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?w=500&q=70"><div><h3 data-n="ქართული ღვინო|Georgian wine">ქართული ღვინო</h3><span class="p">12 ₾</span></div></div>
    <div class="item"><img loading="lazy" alt="ლიმონათი" src="https://images.unsplash.com/photo-1621263764928-df1444c5e859?w=500&q=70"><div><h3 data-n="ლიმონათი|Lemonade">ლიმონათი</h3><span class="p">6 ₾</span></div></div>
    <div class="item"><img loading="lazy" alt="ჩაი" src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=500&q=70"><div><h3 data-n="ჩაი|Tea">ჩაი</h3><span class="p">5 ₾</span></div></div>
    <div class="item"><img loading="lazy" alt="ყავა" src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500&q=70"><div><h3 data-n="ყავა|Coffee">ყავა</h3><span class="p">6 ₾</span></div></div>
  </div>
</section>

<button class="chat" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 11h6M9 14h4"/></svg></button>

<script>
const T={
  ka:{profile:"პროფილი",menu:"მენიუ",delivery:"მიტანის სერვისი",choose:"აირჩიე კატეგორია",food:"საჭმელი",drinks:"სასმელი"},
  en:{profile:"Profile",menu:"Menu",delivery:"Delivery service",choose:"Choose a category",food:"Food",drinks:"Drinks"}
};
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{
  const l=b.dataset.lang;
  document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('on',x===b));
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
  document.querySelectorAll('[data-n]').forEach(e=>e.textContent=e.dataset.n.split('|')[l==='ka'?0:1]);
}));
</script>
</body>
</html>
